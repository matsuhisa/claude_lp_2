<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Guide</title>
<!--
  components.html / token.html / token-editor.html をまとめて行き来するための入口ページ。
  各ページの中身はそれぞれの実ファイルにiframeで委譲するだけで、内容の複製はしない。
  ページを追加した場合は下記 PAGES に1行足す。
-->
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body {
    display: flex;
  }
  nav {
    flex: 0 0 200px;
    background: #1A1D23;
    color: #E6E8EB;
    padding: 24px 0;
    overflow-y: auto;
  }
  nav h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #8A8F98;
    margin: 0 20px 12px;
  }
  nav a {
    display: block;
    padding: 10px 20px;
    color: #E6E8EB;
    text-decoration: none;
    font-size: 14px;
    border-left: 3px solid transparent;
  }
  nav a:hover {
    background: #24272E;
  }
  nav a.active {
    background: #24272E;
    border-left-color: #5B8DEF;
    color: #FFFFFF;
    font-weight: 600;
  }
  main {
    flex: 1 1 auto;
    min-width: 0;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
</style>
</head>
<body>
<nav>
  <h1>Brand Guide</h1>
  <a href="#components" data-src="components.html">Components</a>
  <a href="#token" data-src="token.html">Tokens</a>
  <a href="#token-editor" data-src="token-editor.html">Token Editor</a>
</nav>
<main>
  <iframe id="viewer" title="content"></iframe>
</main>
<script>
  const links = document.querySelectorAll('nav a');
  const viewer = document.getElementById('viewer');

  function show(hash) {
    const id = (hash || '').replace('#', '') || 'components';
    let matched = null;
    links.forEach(a => {
      const isMatch = a.getAttribute('href') === '#' + id;
      a.classList.toggle('active', isMatch);
      if (isMatch) matched = a;
    });
    viewer.src = (matched || links[0]).dataset.src;
  }

  window.addEventListener('hashchange', () => show(location.hash));
  show(location.hash);
</script>
</body>
</html>
