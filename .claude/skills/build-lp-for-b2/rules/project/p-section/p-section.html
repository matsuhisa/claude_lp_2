<!--
- コンテンツの集まり
  - LP は、複数個のセクションで成立する
  - セクションには種類がある（ modifier になる ）
    - 通常
    - 通常と背景が異なる
  - inner が PC と スマートフォンで padding が異なる

interface Section {
  sectionType: string;
  header: c-section-head;
  children: ;
}
-->

<section class="p-section {sectionType}">
  <div class="p-section__inner">
    <header class="p-section__header">
      {c-section-head}
    </header>
    <div class="p-section__body">
      {children}
    </div>
  </div>
</section>
