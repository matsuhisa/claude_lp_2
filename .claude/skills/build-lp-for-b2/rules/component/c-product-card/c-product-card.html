<!--
# 名前・目的
  - 商品カード

interface ProductCard {
  "id":5678;
  "name":"【有機JAS 認証】シャキシャキ！新食感の甘～いスナックミニトマト【信州安曇野産】1㎏";
  "farmingMethodId":1234;
  "farmingMethodName":"農薬化学肥料不使用";
  "price":2600;
  "imageUrl":"https://placehold.jp/360x270.png";
  "fewStock":false;
  "hasStock":true;
  "producerId":4649;
  "producerName":"山田太郎農園";
  "producerPrefectureCode":20;
  "producerPrefectureName":"長野県";
  "producerCityName":"安曇野市穂高";
  "producerImageUrl":"https://placehold.jp/300x300.png";
  "freeShipping":true;
  "hasMunicipalityDiscountCampaign": false;
  "discountPrice": 0;
}
-->

    <div class="c-product-card">
      <a href={"#"} class="c-product-card__item">
        <div class="c-product-card__image">
          <img src={imageUrl} alt="" class="c-product-card__photo" />
        </div>
        <div class="c-product-card__item-body">
          <div class="c-product-card__name">
            {product.name}
          </div>
          <div class="c-product-card__price">
            { freeShipping && <span class="c-product-card__price-free-shipping-label">送料無料</span> }
            { hasMunicipalityDiscountCampaign && <span class="c-product-card__campaign-discount-label">¥{discountPrice.toLocaleString()}引き</span> }
            <span>&yen;</span>
            <span class="c-product-card__price-number">{price.toLocaleString()}</span>
          </div>
        </div>
      </a>
      <a href={"/producers/"} class="c-product-card__farmer">
        <div class="c-product-card__farmer-icon">
          <img src={producerImageUrl}  alt="" class="c-product-card__farmer-icon-photo" />
        </div>
        <div class="c-product-card__farmer-profile">
          <div class="c-product-card__farmer-area">
            {producerCityName}
          </div>
          <div class="c-product-card__farmer-name">
            {producerName}
          </div>
        </div>
      </a>
    </div>
