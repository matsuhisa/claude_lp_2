<!--
# 名前・目的
- セクション見出し
  - タイトル(必須)とサブタイトル(任意)を中央揃えで表示する、セクション本文の前に置く見出しブロック

# 使い方の注意点
- Blockにmarginを含めないため、後続コンテンツとの余白はページ側(このc-section-headを含むラッパー要素のgapや、後続要素のmargin-top)で調整する

interface SectionHead {
  title: string;
  subTitle?: string; // 任意
}
-->

<div class="c-section-head">
  <h2 class="c-section-head__title">{title}</h2>
  <p class="c-section-head__sub-title">{subTitle}</p>
</div>
