<!--
# 名前・目的
- 生産者紹介コンテンツ
  - 写真は c-avatar(円形)とは異なる、矩形のポートレート写真
  - varieties には生産している品種のタグを数個並べる。1品種ごとに
    `<span class="c-producer__label">{品種名}</span>` を使う

interface Producer {
  photoUrl: string;
  photoAlt: string;
  name: string;
  varieties: ; // 品種タグ(c-producer__label)を数個並べる
  description?: string; // 50〜100文字
  href?: string; // 任意
}
-->

<a href={href} class="c-producer">
  <img class="c-producer__photo" src={photoUrl} alt={photoAlt} />
  <div class="c-producer__body">
    <h3 class="c-producer__name">{name}</h3>
    <div class="c-producer__labels">{varieties}</div>
    <p class="c-producer__description">{description}</p>
  </div>
</a>
